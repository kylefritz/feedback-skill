name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3   # no floating major tag; pin the release
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: uv run --with pytest pytest -q tests
      - run: node --test tests/worker.test.mjs
